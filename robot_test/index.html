<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  #robot { width: 100%; height: 100%; }
  #error { display: none; font: 14px sans-serif; color: #B42318; padding: 12px; }
</style>
<!-- 라이브러리(Three.js)를 CDN 주소에서 불러오기 -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="robot"></div>
<div id="error">로봇을 불러오지 못했어요. 인터넷 연결을 확인해주세요.</div>
<script type="module">
/*ROBOT_JS*/

// 앱(파이썬)에서 넘겨준 표정 값
const START_EXPRESSION = __EXPRESSION__;
try {
  const robot = createRobot(document.getElementById('robot'));
  robot.setExpression(START_EXPRESSION);
  window.robot = robot; // 시험용
} catch (err) {
  console.error(err);
  document.getElementById('error').style.display = 'block';
}
</script>
</body>
</html>
