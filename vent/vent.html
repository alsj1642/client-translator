<section class="vent" aria-label="하소연">
  <!-- 인사: 핀으로 꽂아둔 메모 종이 -->
  <div class="vent-note">
    <svg class="vent-pin" width="30" height="34" viewBox="0 0 30 34" fill="none" aria-hidden="true">
      <path d="M15 20 L15 32" stroke="#111" stroke-width="1.5" stroke-linecap="round" />
      <ellipse cx="15" cy="21" rx="9" ry="3" fill="#fff" stroke="#111" stroke-width="1.5" />
      <circle cx="15" cy="11" r="9.25" fill="#76F25C" stroke="#111" stroke-width="1.5" />
      <path d="M10.5 8.5 Q12 5.5 15 5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" />
    </svg>
    <p class="vent-note-title">오늘 클라이언트 때문에 힘들었나요?</p>
    <p class="vent-note-sub">여기에 다 털어놓고 가세요. 적은 글은 저장되지 않고, 던지면 사라져요.</p>
  </div>

  <label class="vent-label" for="vent-text">하소연 적기</label>

  <!-- 캡슐 필터: 로봇 한마디 켜짐/꺼짐 (기본 켜짐) + 말투 -->
  <div class="vent-filters">
    <div class="vent-filter">
      <span class="vent-filter-label" id="vent-ai-label">눈치봇의 한마디</span>
      <div class="vent-pills vent-ai" role="radiogroup" aria-labelledby="vent-ai-label">
        <button type="button" role="radio" aria-checked="true" data-ai="on">켜짐</button>
        <button type="button" role="radio" aria-checked="false" data-ai="off">꺼짐</button>
      </div>
    </div>
    <div class="vent-filter vent-tone">
      <span class="vent-filter-label" id="vent-tone-label">말투</span>
      <div class="vent-pills" role="radiogroup" aria-labelledby="vent-tone-label">
        <button type="button" role="radio" aria-checked="true" data-tone="정중">정중</button>
        <button type="button" role="radio" aria-checked="false" data-tone="팩폭">팩폭</button>
      </div>
    </div>
  </div>
  <p class="vent-filter-sub">켜면 로봇이 한마디 해줘요. 적은 글이 AI에게 전달돼요.</p>

  <!-- 줄 종이에 적기 -->
  <div class="vent-paper">
    <textarea id="vent-text" rows="6" placeholder="이런 요청을 받았다면 누구라도 답답하죠. 마음껏 적어보세요."></textarea>
  </div>
  <div class="vent-meta">
    <span>이름, 연락처, 회사명은 쓰지 마세요.</span>
    <span class="vent-count" aria-live="polite">0자</span>
  </div>

  <!-- 로봇 + 한마디: 줄 종이 바로 아래. 던지기 전엔 로봇도 없음 (던지면 나타나서 말풍선으로 한마디) -->
  <div class="vent-reply" hidden>
    <div class="vent-robot" role="img" aria-label="눈치봇"></div>
    <div class="vent-bubble" aria-live="polite">
      <p class="vent-reply-text"></p>
    </div>
  </div>

  <!-- 버튼 + 쓰레기통 (던지면 뚜껑이 열림) -->
  <div class="vent-actions">
    <button type="button" class="vent-throw">구겨서 던지기</button>
    <button type="button" class="vent-burn">쓰레기통 불태우기</button>
    <div class="vent-bin" aria-hidden="true">
      <!-- 불태우기: 불길이 솟고 → 쓰레기통이 타서 재 더미가 됨 (vent.js) -->
      <svg class="vent-fire" viewBox="0 0 110 120" fill="none">
        <g class="flame f1">
          <path d="M28 30 C36 46 50 56 48 80 C46 100 38 116 28 116 C16 116 6 104 6 86 C6 68 16 56 20 44 C23 52 25 56 28 60 C29 48 28 40 28 30 Z" fill="#FF7A1A" stroke="#111" stroke-width="1.5" stroke-linejoin="round" />
          <path d="M28 64 C33 74 38 82 37 94 C36 104 32 110 28 110 C23 110 18 104 18 96 C18 86 25 80 28 64 Z" fill="#FFC93C" stroke="#111" stroke-width="1.2" stroke-linejoin="round" />
        </g>
        <g class="flame f3">
          <path d="M82 30 C74 46 60 56 62 80 C64 100 72 116 82 116 C94 116 104 104 104 86 C104 68 94 56 90 44 C87 52 85 56 82 60 C81 48 82 40 82 30 Z" fill="#FF7A1A" stroke="#111" stroke-width="1.5" stroke-linejoin="round" />
          <path d="M82 64 C77 74 72 82 73 94 C74 104 78 110 82 110 C87 110 92 104 92 96 C92 86 85 80 82 64 Z" fill="#FFC93C" stroke="#111" stroke-width="1.2" stroke-linejoin="round" />
        </g>
        <g class="flame f2">
          <path d="M55 2 C68 26 88 40 84 72 C81 98 68 118 55 118 C40 118 26 100 26 76 C24 56 38 44 43 24 C49 36 51 42 55 48 C56 32 55 18 55 2 Z" fill="#FF7A1A" stroke="#111" stroke-width="1.5" stroke-linejoin="round" />
          <path d="M55 48 C64 64 72 74 70 90 C68 104 62 112 55 112 C47 112 40 104 40 92 C40 78 50 70 55 48 Z" fill="#FFC93C" stroke="#111" stroke-width="1.2" stroke-linejoin="round" />
          <path d="M55 80 C59 88 62 94 61 100 C60 106 58 110 55 110 C51 110 49 106 49 101 C49 95 53 90 55 80 Z" fill="#FFF3C4" stroke="#111" stroke-width="1" stroke-linejoin="round" />
        </g>
      </svg>
      <svg class="vent-ash" viewBox="0 0 60 26" fill="none">
        <path d="M3 24 C9 12 19 8 30 10 C41 8 51 13 57 24 Z" fill="#55554F" stroke="#111" stroke-width="1.5" stroke-linejoin="round" />
        <path d="M16 18 L19 16 M28 15 L31 14 M40 17 L43 19" stroke="#EBEBE6" stroke-width="1.5" stroke-linecap="round" />
        <circle cx="23" cy="20" r="1.6" fill="#FF7A1A" />
        <circle cx="37" cy="21" r="1.3" fill="#FF7A1A" />
      </svg>
      <span class="vent-smoke"></span>
      <span class="vent-smoke"></span>
      <svg class="vent-can" width="52" height="60" viewBox="0 0 52 60" fill="none">
        <g class="vent-lid">
          <rect x="20" y="1.5" width="12" height="5" rx="2" fill="#fff" stroke="#111" stroke-width="1.5" />
          <rect x="3" y="6" width="46" height="7" rx="2" fill="#fff" stroke="#111" stroke-width="1.5" />
        </g>
        <path d="M7 14 L10 57 H42 L45 14 Z" fill="#fff" stroke="#111" stroke-width="1.5" stroke-linejoin="round" />
        <path d="M18 21 V50 M26 21 V50 M34 21 V50" stroke="#111" stroke-width="1.5" />
      </svg>
    </div>
  </div>
</section>
