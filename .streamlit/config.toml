# 앱 디자인 설정 (색, 글꼴, 모서리)
# 색을 바꾸고 싶으면 아래 # 코드만 고치면 됩니다.

[theme]
font = "Pretendard"
headingFont = "Pretendard"
baseRadius = "0.75rem"
buttonRadius = "0.625rem"
showWidgetBorder = true

[[theme.fontFaces]]
family = "Pretendard"
url = "https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/woff2/PretendardVariable.woff2"
weight = "45 920"

# 밝은/어두운 화면 모두 같은 색: 흰 바탕 + 검은 선 + 형광 연두 포인트 (키치한 라인 스타일)
# (선, 카드, 형광 연두 버튼 모양 자체는 styles.css에서 그려요. 여기 색은 글자/버튼 기본색)
# 카드 제목 색(blue/orange/green/violet)은 흑백 라인 스타일에 맞춰 모두 검정이에요.
[theme.light]
primaryColor = "#111111"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EBEBE6"
textColor = "#111111"
borderColor = "#111111"
violetColor = "#111111"
orangeColor = "#111111"
greenColor = "#111111"
blueColor = "#111111"

# 어두운 화면 (컴퓨터가 다크 모드일 때): 밝은 화면과 같은 색
[theme.dark]
primaryColor = "#111111"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#EBEBE6"
textColor = "#111111"
borderColor = "#111111"
violetColor = "#111111"
orangeColor = "#111111"
greenColor = "#111111"
blueColor = "#111111"
