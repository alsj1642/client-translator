# 앱 디자인 설정 (색, 글꼴, 모서리)
# 색을 바꾸고 싶으면 아래 # 코드만 고치면 됩니다.

[theme]
font = "Pretendard"
headingFont = "Pretendard"
baseRadius = "0.75rem"
buttonRadius = "0.625rem"
showWidgetBorder = true

[[theme.fontFaces]]
family = "Pretendard"
url = "https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/woff2/PretendardVariable.woff2"
weight = "45 920"

# 밝은 화면 (크림색 배경 + 검정 글자, 버튼은 검정)
# violetColor는 이름과 달리 '회신 초안' 카드 제목의 연두색이에요.
[theme.light]
primaryColor = "#111111"
backgroundColor = "#F7F6F1"
secondaryBackgroundColor = "#ECEAE2"
textColor = "#111111"
borderColor = "#DCD9CF"
violetColor = "#4D7C0F"
orangeColor = "#B45309"
greenColor = "#0F766E"
blueColor = "#1D4ED8"

# 어두운 화면 (컴퓨터가 다크 모드일 때)
[theme.dark]
primaryColor = "#2563EB"
backgroundColor = "#0E0E10"
secondaryBackgroundColor = "#1A1A1E"
textColor = "#F2F1EC"
borderColor = "#2C2C31"
violetColor = "#BEF264"
orangeColor = "#F5B35C"
greenColor = "#4FD1C0"
blueColor = "#8FB0FF"
