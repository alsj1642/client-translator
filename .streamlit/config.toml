# 앱 디자인 설정 (색, 글꼴, 모서리)
# 색을 바꾸고 싶으면 아래 # 코드만 고치면 됩니다.

[theme]
font = "Pretendard"
headingFont = "Pretendard"
baseRadius = "0.75rem"
buttonRadius = "0.625rem"
showWidgetBorder = true

[[theme.fontFaces]]
family = "Pretendard"
url = "https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/woff2/PretendardVariable.woff2"
weight = "45 920"

# 밝은 화면
[theme.light]
primaryColor = "#4338CA"
backgroundColor = "#F7F7F5"
secondaryBackgroundColor = "#EEEEEA"
textColor = "#1C1C1E"
borderColor = "#E2E2DC"
violetColor = "#6D28D9"
orangeColor = "#B45309"
greenColor = "#0F766E"
blueColor = "#4338CA"

# 어두운 화면 (컴퓨터가 다크 모드일 때)
[theme.dark]
primaryColor = "#5B54E8"
backgroundColor = "#141416"
secondaryBackgroundColor = "#1F1F23"
textColor = "#ECECEE"
borderColor = "#2E2E34"
violetColor = "#B79CFA"
orangeColor = "#F5B35C"
greenColor = "#4FD1C0"
blueColor = "#8B87F5"
