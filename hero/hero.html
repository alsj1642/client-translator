<section class="hero" aria-label="서비스 소개">
  <div class="hero-box">
    <header class="hero-top">
      <div class="brand"><span>눈치봇👀</span></div>
    </header>

    <!-- 큰 카피: 로봇 뒤에 깔리고 화면 폭을 꽉 채움. 윗줄은 왼쪽 끝 말 + (가운데 로봇) + 오른쪽 끝 말,
         아랫줄은 통째로 가운데 정렬 (로봇이 가운데 글자를 가려도 됨) -->
    <h1 class="hero-title" aria-label="모호한 피드백, 눈치껏 번역해드릴게요">
      <span class="line" aria-hidden="true"><span class="left">모호한</span><span class="right">피드백🤔</span></span>
      <span class="line single" aria-hidden="true">눈치껏👀 번역해드릴게요👌</span>
    </h1>

    <!-- 3D 로봇(눈치봇) 자리: 가운데, 큰 카피 위. 로봇을 못 불러오면 빈 자리로 남아요. -->
    <div class="hero-robot" role="img" aria-label="눈치봇 캐릭터"></div>

    <footer class="hero-bottom">
      <span class="hint">번역하러 가기 ↓</span>
    </footer>

    <!-- 아래로 스크롤할수록 짙어지는 불투명 유리 -->
    <div class="hero-frost" aria-hidden="true"></div>
  </div>
</section>
